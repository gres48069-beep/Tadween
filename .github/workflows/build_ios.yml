name: Build Tadween iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate iOS platform files
        run: |
          flutter create --platforms=ios .
          rm -rf test

      - name: Set App Display Name
        run: |
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string تدوين" ios/Runner/Info.plist

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Flutter iOS config
        run: flutter build ios --config-only --release --no-codesign

      - name: Build iOS App via xcodebuild (Unsigned)
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT=$(pwd)/../build/ios \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/Release-iphoneos/Runner.app Payload/
          zip -r tadween.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tadween-ipa
          path: tadween.ipa
